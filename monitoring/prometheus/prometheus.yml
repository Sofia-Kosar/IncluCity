global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Spring Boot Actuator (Micrometer) — порт 8081 доступний лише в docker-мережі
  - job_name: inclucity-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8081"]
