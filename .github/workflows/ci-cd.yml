name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — збірка і тести
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-password
          MYSQL_DATABASE: hackathon_2025_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-password --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_URL: jdbc:mysql://localhost:3306/hackathon_2025_test
      DB_USERNAME: root
      DB_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Maven verify (компіляція + тести)
        working-directory: server
        run: mvn -B verify
      - name: Звіти тестів
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: server/target/surefire-reports
          if-no-files-found: ignore

  frontend:
    name: Frontend — lint і збірка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /api/v1
          BACKEND_URL: http://backend:8080

  docker:
    name: Docker — збірка і публікація образів у GHCR
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: ./server
            build_args: ""
          - name: client
            context: ./client
            build_args: |
              NEXT_PUBLIC_API_URL=/api/v1
              BACKEND_URL=http://backend:8080
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Нижній регістр імені власника (вимога GHCR)
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER_LC }}/inclucity-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.build_args }}
          # у pull request образ лише збирається (перевірка Dockerfile), у main — публікується
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy — оновлення стеку на self-hosted runner
    needs: docker
    # вмикається, коли в Settings → Secrets and variables → Actions → Variables задано
    # DEPLOY_ENABLED=true та DEPLOY_ENV_FILE (шлях до .env на машині з runner)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Вхід у GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Оновлення контейнерів
        env:
          ENV_FILE: ${{ vars.DEPLOY_ENV_FILE }}
        run: |
          set -e
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          export IMAGE_PREFIX="ghcr.io/${OWNER_LC}/inclucity" IMAGE_TAG=latest
          docker compose --env-file "$ENV_FILE" pull backend client
          docker compose --env-file "$ENV_FILE" up -d --remove-orphans --no-build
      - name: Перевірка працездатності (health)
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' inclucity-backend 2>/dev/null || echo none)
            echo "backend health: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 5
          done
          docker logs --tail=50 inclucity-backend
          exit 1
